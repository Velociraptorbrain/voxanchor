name: Build and Package VoxAnchor

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Build
        run: cmake --build build --config Release

      # --- MACOS SPECIFIC PACKAGING ---
      - name: Install Packaging Tools (macOS)
        if: runner.os == 'macOS'
        run: brew install create-dmg librsvg

      - name: Create DMG Installer (macOS)
        if: runner.os == 'macOS'
        run: |
          APP_PATH=$(find build -name "VoxAnchor.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          create-dmg \
            --volname "VoxAnchor" \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 450 200 \
            --icon "VoxAnchor.app" 150 200 \
            VoxAnchor.dmg \
            "$APP_PATH" || echo "DMG creation failed."

      # --- UPLOAD THE FILES ---
      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VoxAnchor-${{ matrix.os }}
          path: |
            build/VoxAnchor_artefacts/Release/**
            VoxAnchor.dmg
          if-no-files-found: warn
